sans-serif" font-size="16" font-weight="600" fill="#A5522A" text-anchor="start">Choose next action</text><text x="280" y="266" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#25374D" text-anchor="start">Check pool + budget</text><text x="280" y="290" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">Sufficient → Rank</text><text x="280" y="312" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">Shortfall → Acquire</text><text x="280" y="334" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">No update → Hold</text><rect x="576" y="40" width="168" height="56" rx="6" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="592" y="64" font-family="'Geist',Arial,sans-serif" font-size="16" font-weight="600" fill="#315D83" text-anchor="start">Acquire</text><text x="592" y="84" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">state r · sources</text><rect x="576" y="136" width="168" height="64" rx="6" fill="white" stroke="#315D83" stroke-width="1.2"/><text x="592" y="158" font-family="'Geist',Arial,sans-serif" font-size="16" font-weight="600" fill="#315D83" text-anchor="start">Candidate pool</text><rect x="600" y="164" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="612" y="183" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">A</text><rect x="640" y="164" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="652" y="183" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">B</text><rect x="680" y="164" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="692" y="183" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">C</text><rect x="576" y="232" width="168" height="56" rx="6" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="592" y="256" font-family="'Geist',Arial,sans-serif" font-size="16" font-weight="600" fill="#315D83" text-anchor="start">Rank</text><text x="592" y="276" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">uses the same state r</text><rect x="576" y="328" width="168" height="64" rx="6" fill="white" stroke="#315D83" stroke-width="1.2"/><text x="592" y="350" font-family="'Geist',Arial,sans-serif" font-size="16" font-weight="600" fill="#315D83" text-anchor="start">Displayed slate</text><rect x="600" y="356" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="612" y="375" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">C</text><rect x="640" y="356" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="652" y="375" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">A</text><rect x="680" y="356" width="24" height="28" rx="2" fill="#F0F5F9" stroke="#315D83" stroke-width="1.2"/><text x="692" y="375" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="500" fill="#315D83" text-anchor="middle">B</text><path d="M40 432H744" fill="none" stroke="#B7C5D1" stroke-width="1" stroke-linejoin="round"/><text x="40" y="452" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#25374D" text-anchor="start">Dashed boxes: proposed modules</text><text x="744" y="452" font-family="'Geist',Arial,sans-serif" font-size="14" font-weight="400" fill="#536A80" text-anchor="end">Model parameters stay frozen</text></svg>
