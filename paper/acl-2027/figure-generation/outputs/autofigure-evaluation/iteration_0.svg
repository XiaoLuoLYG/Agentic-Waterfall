<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="76.2mm" viewBox="0 0 1440 686" role="img" aria-labelledby="title desc"> <title id="title">Paired multi-round evaluation under a common budget</title> <desc id="desc">Planned evaluation protocol with a shared initialization, matched baseline and Waterfall controller trajectories, three illustrative rounds, a synchronized goal correction, lane-specific feedback, and a separate method-blind assessment. No measured outcomes are shown.</desc> <defs> <style> text { font-family: Arial, Helvetica, sans-serif; fill: #24313e; } .heading { font-size: 25px; font-weight: 700; } .label { font-size: 23px; font-weight: 600; } .body { font-size: 22px; } .small { font-size: 20px; } .directive { font-size: 16px; fill: #394149; } .muted { fill: #637180; } .purple { fill: #79619b; } .teal { fill: #287f7b; } .amber { fill: #9c7025; } .flow { fill: none; stroke: #708090; stroke-width: 1.8; marker-end: url(#arrow); } .reaction { fill: none; stroke: #bd9146; stroke-width: 1.8; marker-end: url(#amber-arrow); } .instruction { fill: none; stroke: #bd9146; stroke-width: 1.7; stroke-dasharray: 5 5; } .output { fill: none; stroke: #71808e; stroke-width: 1.7; } .metric-icon { fill: none; stroke: #647586; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; } </style> <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"> <path d="M0 0L8 4L0 8Z" fill="#708090"/> </marker> <marker id="amber-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"> <path d="M0 0L8 4L0 8Z" fill="#bd9146"/> </marker> <!-- Small state records: distinct from displayed document cards. --> <g id="state-record"> <rect x="7" y="0" width="58" height="35" rx="3" fill="#f5f0fa" stroke="#9a86b4"/> <rect x="3" y="5" width="58" height="35" rx="3" fill="#f1ebf7" stroke="#9a86b4"/> <rect x="0" y="10" width="58" height="35" rx="3" fill="#eee7f6" stroke="#79619b" stroke-width="1.4"/> <path d="M10 21H46 M10 29H46 M10 37H33" fill="none" stroke="#9a86b4" stroke-width="1.4"/> </g> <g id="document"> <path d="M0 0H23L33 10V47H0Z" fill="#ffffff" stroke="#438e89" stroke-width="1.5"/> <path d="M23 0V10H33" fill="#e2f1ee" stroke="#438e89" stroke-width="1.2"/> <path d="M7 34H26 M7 40H23" fill="none" stroke="#9cbfba" stroke-width="1.2"/> </g> <!-- One reusable round scaffold; all labels remain editable SVG text. --> <g id="round"> <text x="0" y="-9" class="body purple">State</text> <use href="#state-record" x="0" y="0"/> <text x="-2" y="77" class="small muted">Candidates</text> <path d="M70 23H91" class="flow"/> <text x="102" y="17" class="body">Choose</text> <text x="102" y="41" class="body">action</text> <path d="M179 23H199" class="flow"/> <text x="210" y="-9" class="body teal">Shown</text> <use href="#document" x="210" y="0"/> <use href="#document" x="252" y="0"/> <path d="M268 50V67" class="reaction"/> <text x="210" y="92" class="body amber">Feedback*</text> </g> </defs> <!-- White, paper-ready canvas. --> <rect width="1440" height="686" fill="#ffffff"/> <text x="24" y="30" class="heading">Paired multi-round evaluation</text> <text x="825" y="29" class="small purple">State</text> <text x="905" y="29" class="small teal">Displayed content</text> <text x="1110" y="29" class="small amber">Feedback</text> <text x="1240" y="29" class="small muted">Planned protocol</text> <!-- Common exogenous instruction; dashed delivery is not a feedback edge. --> <rect x="493" y="48" width="878" height="48" rx="6" fill="#fcf6e9" stroke="#e2cfaa"/> <text x="510" y="79" class="body"> <tspan class="amber">Before round 2:</tspan> <tspan> “Too advanced. Start with basics.”</tspan> </text> <text x="670" y="121" class="small muted">Same release step; no future instructions visible</text> <!-- Shared setup, not a shared continuing candidate pool. --> <text x="24" y="126" class="label">Shared setup</text> <path d="M24 140H219" stroke="#c8d1db" stroke-width="1.5"/> <text x="24" y="171" class="body"> <tspan x="24">Same initial</tspan> <tspan x="24" dy="27">history, sources,</tspan> <tspan x="24" dy="27">model, and budget.</tspan> </text> <text x="24" y="278" class="small muted"> <tspan x="24">Same scoring backend</tspan> <tspan x="24" dy="25">and tool access.</tspan> </text> <text x="24" y="356" class="small muted"> <tspan x="24">Independent candidate</tspan> <tspan x="24" dy="25">acquisition and slates.</tspan> </text> <!-- Matched branch: equal line weight and lane emphasis. --> <path d="M221 246H238V223H269" class="flow"/> <path d="M238 246V397H269" class="flow"/> <text x="280" y="143" class="small muted">ROUND 1</text> <text x="1020" y="143" class="small muted">ROUND 3 · …</text> <text x="650" y="143" class="small muted">ROUND 2</text> <!-- Two aligned timeline lanes. --> <rect x="259" y="179" width="1142" height="135" rx="7" fill="#f4f7fb"/> <rect x="259" y="353" width="1142" height="135" rx="7" fill="#f2f8f7"/> <path d="M260 188V305" stroke="#6f8eaf" stroke-width="3"/> <path d="M260 362V479" stroke="#649e98" stroke-width="3"/> <text x="280" y="170" class="label" fill="#496c91">Matched baseline</text> <text x="280" y="344" class="label" fill="#377e79">Waterfall controller</text> <!-- Synchronized instruction delivery into both round-2 states. --> <path d="M638 96V397" class="instruction"/> <path d="M638 223H647" class="reaction" stroke-dasharray="3 3"/> <path d="M638 397H647" class="reaction" stroke-dasharray="3 3"/> <!-- Baseline round 1. --> <g transform="translate(280 200)"> <use href="#round"/> <text x="0" y="102" class="small muted">A · B · D</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">A</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">B</text> </g> <path d="M599 286H618V223H647" class="reaction"/> <!-- Baseline round 2. --> <g transform="translate(650 200)"> <use href="#round"/> <text x="0" y="102" class="small muted">C · D · F</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">C</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">D</text> </g> <path d="M969 286H988V223H1017" class="reaction"/> <!-- Baseline round 3; continuation is not a fixed horizon. --> <g transform="translate(1020 200)"> <use href="#round"/> <text x="0" y="102" class="small muted">B · E · G</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">B</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">E</text> </g> <path d="M1339 286H1360V223H1376" class="reaction"/> <text x="1380" y="230" class="body purple">…</text> <!-- Waterfall round 1. --> <g transform="translate(280 374)"> <use href="#round"/> <text x="0" y="102" class="small muted">A · C · E</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">A</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">C</text> </g> <path d="M599 460H618V397H647" class="reaction"/> <!-- Waterfall round 2. --> <g transform="translate(650 374)"> <use href="#round"/> <text x="0" y="102" class="small muted">B · E · H</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">B</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">H</text> </g> <path d="M969 460H988V397H1017" class="reaction"/> <!-- Waterfall round 3. --> <g transform="translate(1020 374)"> <use href="#round"/> <text x="0" y="102" class="small muted">D · F · G</text> <text x="226.5" y="27" text-anchor="middle" class="body teal">D</text> <text x="268.5" y="27" text-anchor="middle" class="body teal">F</text> </g> <path d="M1339 460H1360V397H1376" class="reaction"/> <text x="1380" y="404" class="body purple">…</text> <!-- One-way collection of logs from both trajectories; no return edge. --> <path d="M1394 303H1420V519H219V542" class="output" marker-end="url(#arrow)"/> <path d="M1394 477H1420" class="output"/> <circle cx="1420" cy="477" r="3" fill="#71808e"/> <rect x="803" y="501" width="398" height="28" fill="#ffffff"/> <text x="817" y="522" class="small muted">Both trajectories: slates + event logs</text> <!-- Evaluation band, visually independent of the policy trajectories. --> <text x="24" y="565" class="label">Method-blind usefulness assessment</text> <text x="24" y="592" class="small muted">Independent of policy and feedback simulator</text> <text x="24" y="623" class="small"> <tspan x="24">Evaluation labels only;</tspan> <tspan x="24" dy="25">no controller feedback.</tspan> </text> <!-- Illustrator placeholder: the description is production guidance, to be removed when the final human-audit icon is drawn. --> <g id="human-audit-placeholder"> <text x="302" y="618" class="small">Human audit</text> <rect x="302" y="626" width="173" height="43" rx="8" ry="8" style="fill:#cccccc;stroke:#666666;stroke-width:1;"/> <text x="310" y="642" class="directive"> <tspan x="310">[icon]: A human hand</tspan> <tspan x="310" dy="18">reviewing labeled items</tspan> </text> </g> <path d="M493 545V664" stroke="#d8e0e7" stroke-width="1.3"/> <!-- Measurement group 1: duplicate-aware utility, not measured values. --> <g transform="translate(512 546)"> <g class="metric-icon"> <path d="M4 3H20V25H4Z M10 0H26V20"/> <path d="M9 10H16 M9 15H16 M9 20H16"/> </g> <text x="38" y="22" class="label">Useful distinct items</text> <text x="0" y="56" class="body"> <tspan x="0">Count useful content once</tspan> <tspan x="0" dy="27">per duplicate group;</tspan> <tspan x="0" dy="27">plus ranking quality.</tspan> </text> </g> <!-- Measurement group 2: correction response and edit persistence. --> <g transform="translate(825 546)"> <g class="metric-icon"> <path d="M2 24V14H13V4H27 M21 0L27 4L21 8"/> <path d="M2 30H28"/> </g> <text x="39" y="22" class="label">Adaptation</text> <text x="0" y="56" class="body"> <tspan x="0">Exposures after a</tspan> <tspan x="0" dy="27">goal correction;</tspan> <tspan x="0" dy="27">inappropriate</tspan> <tspan x="0" dy="27">persistent edits.</tspan> </text> </g> <!-- Measurement group 3: resource use and update time. --> <g transform="translate(1133 546)"> <g class="metric-icon"> <circle cx="14" cy="16" r="12"/> <path d="M14 8V16L21 20 M10 0H18"/> </g> <text x="39" y="22" class="label">Cost</text> <text x="0" y="56" class="body"> <tspan x="0">Source calls,</tspan> <tspan x="0" dy="27">tokens, and</tspan> <tspan x="0" dy="27">update latency.</tspan> </text> </g> <!-- Interpretation safeguards. --> <text x="24" y="414" class="small muted"> <tspan x="24">Item letters are IDs,</tspan> <tspan x="24" dy="25">not relevance grades.</tspan> </text> <text x="24" y="497" class="small amber">* Feedback on shown items only; synthetic feedback is simulated.</text> <text x="512" y="681" class="small muted">Protocol illustration; no measured outcomes. Three rounds illustrate the protocol, not a fixed horizon.</text>
</svg>