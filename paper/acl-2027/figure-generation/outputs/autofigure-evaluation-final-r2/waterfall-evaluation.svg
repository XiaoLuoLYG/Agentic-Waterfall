<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="73.333mm" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">Paired multi-round evaluation under a common budget</title>
  <desc id="desc">A planned evaluation with a common initialization and two independent, matched trajectories. Each illustrative round includes state and available candidates, an action choice, a displayed slate, and lane-local feedback to the next state. A scheduled correction is released before round two to both methods, without revealing future instructions. Both trajectories are collected for independent, method-blind usefulness assessment and human audit. Evaluation labels do not return to either policy. No measured results are shown.</desc>

  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-size:26px; fill:#273440; }
      .heading { font-size:30px; font-weight:700; }
      .round-label { font-size:28px; font-weight:700; fill:#596b7c; }
      .metric { font-size:28px; font-weight:700; }
      .muted { fill:#586b7b; }
      .purple { fill:#786095; }
      .teal { fill:#287e7a; }
      .amber { fill:#986b24; }
      .flow { fill:none; stroke:#778795; stroke-width:2; marker-end:url(#arrow); }
      .feedback { fill:none; stroke:#b78b40; stroke-width:2; marker-end:url(#amberArrow); }
      .scheduled { fill:none; stroke:#b78b40; stroke-width:2; stroke-dasharray:6 5; marker-end:url(#amberArrow); }
      .icon { fill:none; stroke:#62788a; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    </style>

    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#778795"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#b78b40"/>
    </marker>

    <g id="record">
      <rect x="8" y="0" width="62" height="35" rx="3" fill="#f7f3fa" stroke="#a38bb8" stroke-width="1.5"/>
      <rect x="4" y="5" width="62" height="35" rx="3" fill="#f0eaf6" stroke="#a38bb8" stroke-width="1.5"/>
      <rect x="0" y="10" width="62" height="35" rx="3" fill="#eae2f2" stroke="#80669b" stroke-width="1.8"/>
      <path d="M11 20H49 M11 29H49 M11 38H36" fill="none" stroke="#9b82b2" stroke-width="1.6"/>
    </g>

    <g id="document">
      <path d="M0 0H25L36 11V46H0Z" fill="#fff" stroke="#458c88" stroke-width="1.8"/>
      <path d="M25 0V11H36" fill="#e1efec" stroke="#458c88" stroke-width="1.5"/>
      <path d="M8 37H28" fill="none" stroke="#9cbdb9" stroke-width="1.5"/>
    </g>

    <g id="round">
      <text x="0" y="0" class="purple">State + pool</text>
      <use href="#record" x="20" y="9"/>
      <path d="M97 33H139" class="flow"/>
      <text x="147" y="25">Choose</text>
      <text x="147" y="54">action</text>
      <path d="M232 33H247" class="flow"/>
      <text x="251" y="0" class="teal">Shown</text>
      <use href="#document" x="251" y="9"/>
      <use href="#document" x="295" y="9"/>
      <path d="M251 61V67H331V61 M291 67V76" fill="none" stroke="#458c88" stroke-width="1.7"/>
      <text x="184" y="83" class="amber">Feedback</text>
    </g>
  </defs>

  <rect x="0" y="0" width="1440" height="660" fill="#ffffff"/>

  <!-- Shared initialization and common access, not a shared continuing pool. -->
  <text x="24" y="45">Same history, sources, model, budget</text>
  <text x="24" y="78" class="muted">Same scorer and tool access</text>
  <path d="M24 94H510" fill="none" stroke="#c5cfd8" stroke-width="1.5"/>
  <text x="900" y="45" class="muted">Pools and slates may differ</text>

  <!-- One exogenous instruction, released at the same step to both policies. -->
  <text x="555" y="84" class="amber">“Too advanced. Start with basics.”</text>
  <text x="555" y="119" class="muted">Same-step release before round 2; no future instructions</text>

  <!-- Equal-weight timeline lanes. -->
  <rect x="24" y="174" width="1360" height="120" rx="6" fill="#f2f5fa"/>
  <rect x="24" y="307" width="1360" height="120" rx="6" fill="#f0f7f6"/>
  <path d="M25 186V282" stroke="#7794b3" stroke-width="3"/>
  <path d="M25 319V415" stroke="#71a29d" stroke-width="3"/>

  <text x="44" y="224" class="heading" style="fill:#4e7094">Matched</text>
  <text x="44" y="258" class="heading" style="fill:#4e7094">baseline</text>
  <text x="44" y="357" class="heading" style="fill:#3e827d">Waterfall</text>
  <text x="44" y="391" class="heading" style="fill:#3e827d">controller</text>

  <text x="330" y="158" class="round-label">Round 1</text>
  <text x="705" y="158" class="round-label">Round 2</text>
  <text x="1040" y="158" class="round-label">Round 3 …</text>

  <!-- Shared setup branches into independent trajectories. -->
  <path d="M300 94V231H346" class="flow"/>
  <path d="M300 231V364H346" class="flow"/>
  <circle cx="300" cy="231" r="3" fill="#778795"/>

  <!-- Baseline trajectory. -->
  <g transform="translate(330 198)">
    <use href="#round"/>
    <text x="599" y="236" visibility="hidden"> </text>
    <text x="269" y="40" text-anchor="middle" class="teal">A</text>
    <text x="313" y="40" text-anchor="middle" class="teal">B</text>
  </g>
  <g transform="translate(685 198)">
    <use href="#round"/>
    <text x="269" y="40" text-anchor="middle" class="teal">C</text>
    <text x="313" y="40" text-anchor="middle" class="teal">D</text>
  </g>
  <g transform="translate(1040 198)">
    <use href="#round"/>
    <text x="269" y="40" text-anchor="middle" class="teal">B</text>
    <text x="313" y="40" text-anchor="middle" class="teal">E</text>
  </g>

  <!-- Waterfall trajectory: different displayed IDs do not encode quality. -->
  <g transform="translate(330 331)">
    <use href="#round"/>
    <text x="269" y="40" text-anchor="middle" class="teal">A</text>
    <text x="313" y="40" text-anchor="middle" class="teal">C</text>
  </g>
  <g transform="translate(685 331)">
    <use href="#round"/>
    <text x="269" y="40" text-anchor="middle" class="teal">B</text>
    <text x="313" y="40" text-anchor="middle" class="teal">H</text>
  </g>
  <g transform="translate(1040 331)">
    <use href="#round"/>
    <text x="269" y="40" text-anchor="middle" class="teal">D</text>
    <text x="313" y="40" text-anchor="middle" class="teal">F</text>
  </g>

  <!-- Behavioral feedback stays in its own lane. -->
  <path d="M621 274V288H668V231H701" class="feedback"/>
  <path d="M976 274V288H1023V231H1056" class="feedback"/>
  <path d="M621 407V421H668V364H701" class="feedback"/>
  <path d="M976 407V421H1023V364H1056" class="feedback"/>

  <!-- Continuation beyond the three illustrative rounds. -->
  <path d="M1331 274V288H1378V252" class="feedback"/>
  <text x="1365" y="237" class="purple">…</text>
  <path d="M1331 407V421H1378V385" class="feedback"/>
  <text x="1365" y="370" class="purple">…</text>

  <!-- Scheduled delivery runs beside the labels, then below them into
       the state records, separately from solid behavioral feedback. -->
  <path d="M680 130V220H705" class="scheduled"/>
  <path d="M680 220V353H705" class="scheduled"/>

  <!-- One-way collection of both trajectories for assessment. -->
  <path d="M1385 282H1408V475H1388" class="flow"/>
  <path d="M1385 415H1408" fill="none" stroke="#778795" stroke-width="2"/>
  <circle cx="1408" cy="415" r="3" fill="#778795"/>

  <text x="24" y="458" class="amber">Feedback on shown items only; synthetic feedback is simulated.</text>
  <text x="1050" y="458" class="muted">Letters are item IDs</text>

  <!-- Independent assessment band: no return connection to the policies. -->
  <path d="M24 476H1388" fill="none" stroke="#d2dbe2" stroke-width="1.5"/>
  <text x="24" y="510" class="heading">Method-blind usefulness assessment</text>
  <text x="24" y="543" class="muted">Independent judge, separate from policy and feedback simulator; no labels return to policy.</text>

  <g transform="translate(1178 485)" class="icon">
    <path d="M5 5H11 M24 5H30V33H5V5"/>
    <rect x="11" y="1" width="13" height="8" rx="2" fill="#ffffff"/>
    <path d="M11 19L16 24L25 14 M11 29H24"/>
  </g>
  <text x="1219" y="510">Human audit</text>

  <!-- Three compact measurement groups; no measured values are depicted. -->
  <g transform="translate(24 570)">
    <g class="icon">
      <path d="M2 5H23V30H2Z M9 0H30V23"/>
      <path d="M8 13H17 M8 19H17 M8 25H17"/>
    </g>
    <text x="43" y="23" class="metric">Useful distinct items</text>
    <text x="0" y="56">Useful once/group; ranking quality</text>
  </g>

  <g transform="translate(500 570)">
    <g class="icon">
      <path d="M2 29V18H13V7H29 M23 1L29 7L23 13"/>
      <path d="M2 34H29"/>
    </g>
    <text x="43" y="23" class="metric">Adaptation after correction</text>
    <text x="0" y="56">Exposures; persistent improper edits</text>
  </g>

  <g transform="translate(984 570)">
    <g class="icon">
      <circle cx="15" cy="19" r="13"/>
      <path d="M15 10V19L23 24 M10 1H20"/>
    </g>
    <text x="43" y="23" class="metric">Calls · tokens · latency</text>
    <text x="0" y="56">Source calls · tokens · update time</text>
  </g>

  <text x="720" y="650" text-anchor="middle" font-size="26">Protocol illustration; no measured results</text>
</svg>